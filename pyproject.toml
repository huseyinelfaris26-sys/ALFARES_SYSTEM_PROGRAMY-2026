[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jazira-agri-os"
version = "0.1.0"
description = "Offline-first agricultural decision support for the Euphrates and Jazira basin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "numpy>=1.26"]

[project.optional-dependencies]
weather = ["requests>=2.31"]
geo = ["rasterio>=1.3", "requests>=2.31", "requests-cache>=1.2", "requests-oauthlib>=1.3", "tqdm>=4.66"]
satellite = ["planetary-computer>=1.0", "pystac-client>=0.8", "rasterio>=1.3", "xarray>=2024.1"]
soil = ["pandas>=2.1", "scikit-learn>=1.4", "scipy>=1.12"]
ai = ["openai>=1.30"]
ai-local = ["onnxruntime>=1.17"]
vision = ["onnxruntime>=1.17"]
all = ["openai>=1.30", "pandas>=2.1", "planetary-computer>=1.0", "pystac-client>=0.8", "rasterio>=1.3", "requests>=2.31", "requests-cache>=1.2", "requests-oauthlib>=1.3", "scikit-learn>=1.4", "scipy>=1.12", "tqdm>=4.66", "xarray>=2024.1"]

[project.scripts]
jazira = "jazira_agri.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
