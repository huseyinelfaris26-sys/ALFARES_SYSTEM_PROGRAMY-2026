[project]
name = "jazira-agri-os"
version = "1.1.0"
description = "JaziraAgri agricultural management application"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Huseyin El Faris", email = "huseyinelfaris26@gmail.com" }
]

dependencies = [
    "flet==1.1.3",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "Pillow>=10.3.0",
    "requests-oauthlib>=2.0.0",
    "requests-cache>=1.2.0",
    "tqdm>=4.66.0"
]

[dependency-groups]
dev = [
    "flet-cli",
    "flet-desktop",
    "flet-web"
]

[tool.flet]
org = "com.jaziraagri"
product = "JaziraAgri-OS"
company = "JaziraAgri"
copyright = "Copyright (C) 2026 by JaziraAgri"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.android]
min_sdk_version = 24

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
