[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jazira-agri-os"
version = "1.1.0"
description = "JaziraAgri agricultural management application"
requires-python = ">=3.11"
dependencies = [
    "flet==0.27.6",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "Pillow>=10.3.0",
    "requests-oauthlib>=2.0.0",
    "requests-cache>=1.2.0",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["jazira_agri*"]

[tool.flet]
org = "com.jaziraagri"
product = "JaziraAgri-OS"
company = "JaziraAgri"

[tool.flet.app]
path = "."
module = "main"

[tool.flet.android]
min_sdk_version = 24

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
