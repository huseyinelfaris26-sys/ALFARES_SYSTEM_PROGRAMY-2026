[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jazira-agri-os"
version = "0.1.0"
description = "Offline-first agricultural decision support for the Euphrates and Jazira basin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "python-dotenv>=1.0.0"]

[project.optional-dependencies]
geo = [
  "numpy>=1.26.0",
  "pandas>=2.0.0",
  "rasterio>=1.9.0",
  "geojson>=3.1.0",
  "shapely>=2.0.0",
  "requests>=2.31.0",
  "requests-cache>=1.2.0",
]
test = [
  "pytest>=8.0.0",
  "pytest-cov>=4.0.0",
]
api = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]
ml = [
  "mlflow>=2.13.0",
  "xgboost>=2.0.0",
  "pandas>=2.0.0",
]
postgres = [
  "psycopg2-binary>=2.9.9",
  "geoalchemy2>=0.14.0",
]

[project.scripts]
jazira = "jazira_agri.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
