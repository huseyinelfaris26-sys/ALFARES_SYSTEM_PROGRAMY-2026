[project]
name = "jazira-agri-os"
version = "1.0.0"
description = "AI-Powered Precision Agriculture OS for NE Syria (Raqqa, Hasakah, Deir ez-Zor)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.3",
    "rasterio>=1.3.9",
    "shapely>=2.0.3",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "pymodbus>=3.6.4",
    "pyserial>=3.5",
    "streamlit>=1.32.0",
    "requests>=2.31.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
