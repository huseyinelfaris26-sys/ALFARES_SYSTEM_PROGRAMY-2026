# pyproject.toml
[project]
name = "jazira-agri-os"
version = "1.1.0"
description = "نظام الجزيرة الزراعي الذكي - حوض الفرات والجزيرة السورية"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "JaziraAgri Team", email = "dev@jaziraagri.com" },
]
keywords = ["agriculture", "flet", "syria", "euphrates", "irrigation"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Android",
]

dependencies = [
    "flet>=0.25.0,<0.27.0",
    "numpy>=1.26.0,<2.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "requests>=2.31.0,<3.0.0",
    "pillow>=10.3.0,<11.0.0",
    "requests-oauthlib>=2.0.0,<3.0.0",
    "requests-cache>=1.2.0,<2.0.0",
    "tqdm>=4.66.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/jaziraagri/jazira-agri-os"

[tool.flet]
org = "com.jaziraagri.os"
product = "JaziraAgri-OS"
company = "JaziraAgri"
copyright = "Copyright (C) 2026 JaziraAgri"

# ✅ التصحيح: entrypoint يشير إلى main.py في الجذر
[tool.flet.app]
entrypoint = "main.py"

[tool.flet.android]
adaptive_icon_background = "#1B5E20"
min_sdk = 24
target_sdk = 34

permissions = [
    "android.permission.INTERNET",
    "android.permission.ACCESS_NETWORK_STATE",
    "android.permission.ACCESS_FINE_LOCATION",
    "android.permission.ACCESS_COARSE_LOCATION",
    "android.permission.CAMERA",
    "android.permission.READ_MEDIA_IMAGES",
    "android.permission.READ_MEDIA_VIDEO",
]
