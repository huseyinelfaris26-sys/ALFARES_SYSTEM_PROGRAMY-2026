services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jazira_agri}
      POSTGRES_USER: ${DB_USER:-jazira}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env}
    volumes:
      - jazira_postgres:/var/lib/postgresql/data
      - ../data/sql/postgres_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jazira} -d ${DB_NAME:-jazira_agri}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DB_HOST: db
      DATABASE_URL: postgresql://${DB_USER:-jazira}:${DB_PASSWORD}@db:5432/${DB_NAME:-jazira_agri}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    profiles: ["ml"]
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--default-artifact-root", "/mlflow/artifacts"]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - jazira_mlflow:/mlflow

volumes:
  jazira_postgres:
  jazira_mlflow:
