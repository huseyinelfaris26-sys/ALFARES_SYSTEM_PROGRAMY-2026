<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17643b" />
    <title>JaziraAgri-OS | نظام الجزيرة الزراعي</title>
    <style>
      :root { color-scheme: light; font-family: Tahoma, Arial, sans-serif; background: #f3f7f2; color: #17381f; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      header { background: #17643b; color: white; padding: 18px max(20px, calc((100% - 1100px)/2)); display:flex; align-items:center; gap:14px; }
      .logo { font-size: 30px; } h1 { font-size: 1.25rem; margin:0; } header p { margin:4px 0 0; opacity:.85; }
      main { max-width:1100px; padding:22px; margin:auto; }
      .card { background:white; border:1px solid #dfe9df; border-radius:14px; padding:20px; margin:14px 0; box-shadow:0 6px 20px #17381f0a; }
      .login { max-width:460px; margin:8vh auto; }
      label { display:block; font-weight:700; margin:14px 0 6px; }
      input,select,button { width:100%; min-height:44px; border-radius:9px; font-size:1rem; }
      input,select { border:1px solid #bdcebf; padding:10px; }
      button { border:0; padding:10px 14px; color:white; background:#237a49; cursor:pointer; font-weight:700; }
      button.secondary { width:auto; background:#476455; }
      .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; }
      .tile { background:#f3faf4; border:1px solid #dcebdd; border-radius:10px; padding:16px; }
      .muted { color:#58705d; } .error { color:#a32525; } .hidden { display:none!important; }
      table { width:100%; border-collapse:collapse; } th,td { text-align:right; padding:10px; border-bottom:1px solid #e6ece6; }
      .split { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
      @media(max-width:600px){ main{padding:14px} header{padding:16px} .card{padding:16px} .split{grid-template-columns:1fr;} }
    </style>
  </head>
  <body>
    <header><span class="logo" aria-hidden="true">🌾</span><div><h1>JaziraAgri-OS</h1><p>منصة المعرفة الزراعية للجزيرة السورية</p></div></header>
    <main>
      <section id="login" class="card login">
        <h2>تسجيل الدخول</h2>
        <p class="muted">استخدم بيانات الحساب المُعدّة في ملف البيئة الخاص بالخادم.</p>
        <form id="loginForm">
          <label for="username">اسم المستخدم</label>
          <input id="username" name="username" autocomplete="username" required />
          <label for="password">كلمة المرور</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button type="submit">دخول</button>
        </form>
        <p id="loginError" class="error" role="alert"></p>
      </section>

      <section id="dashboard" class="hidden">
        <div class="card">
          <button class="secondary" id="logout" type="button">تسجيل الخروج</button>
          <h2>لوحة المعلومات</h2>
          <p id="welcome" class="muted"></p>
          <div class="grid">
            <div class="tile"><strong>قاعدة المعرفة</strong><p id="knowledgeBase">…</p></div>
            <div class="tile"><strong>عدد المزارع</strong><p id="farmCount">…</p></div>
            <div class="tile"><strong>عدد القطع</strong><p id="fieldCount">…</p></div>
            <div class="tile"><strong>حالة قاعدة البيانات</strong><p id="dbStatus">جارٍ الفحص…</p></div>
          </div>
        </div>

        <div class="card split">
          <div>
            <h3>إضافة مزرعة جديدة</h3>
            <form id="farmForm">
              <label>اسم المزرعة</label><input id="farmName" required />
              <label>المنطقة</label><input id="farmRegion" value="tal_abyad" required />
              <label>اسم المالك</label><input id="farmOwner" />
              <label>المساحة (هكتار)</label><input id="farmArea" type="number" step="0.1" value="1" required />
              <label>ملاحظات</label><input id="farmNotes" />
              <button type="submit">حفظ المزرعة</button>
            </form>
          </div>
          <div>
            <h3>إضافة قطعة جديدة</h3>
            <form id="fieldForm">
              <label>اختيار المزرعة</label>
              <select id="fieldFarmSelect"></select>
              <label>اسم القطعة</label><input id="fieldName" required />
              <label>المحصول</label><input id="fieldCrop" value="wheat" required />
              <label>نوع التربة</label><input id="fieldSoil" value="loam" />
              <label>نظام الري</label><input id="fieldIrrigation" value="rainfed" />
              <label>المساحة (هكتار)</label><input id="fieldArea" type="number" step="0.1" value="1" required />
              <button type="submit">حفظ القطعة</button>
            </form>
          </div>
        </div>

        <div class="card">
          <h2>قائمة المزارع</h2>
          <div id="farmList"></div>
        </div>

        <div class="card">
          <h2>سجل النشاط</h2>
          <div id="activityList"></div>
        </div>
      </section>
    </main>

    <script>
      const loginSection = document.getElementById('login');
      const dashboard = document.getElementById('dashboard');
      const farmSelect = document.getElementById('fieldFarmSelect');

      function escapeHtml(text) {
        const value = text == null ? '' : String(text);
        return value.replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      }

      async function fetchJson(url, options = {}) {
        const response = await fetch(url, options);
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.detail || 'Request failed');
        }
        return response.json();
      }

      async function loadDashboard() {
        try {
          const data = await fetchJson('/api/dashboard');
          document.getElementById('welcome').textContent = 'مرحباً ' + data.username;
          document.getElementById('knowledgeBase').textContent = data.knowledge_base;
          document.getElementById('farmCount').textContent = data.farm_count ?? 0;
          document.getElementById('fieldCount').textContent = data.field_count ?? 0;
          document.getElementById('dbStatus').textContent = data.database === 'connected' ? 'متصلة' : data.database === 'unavailable' ? 'غير متاحة' : 'غير مهيأة';

          const farms = data.farms || [];
          if (farmSelect) {
            farmSelect.innerHTML = farms.map(farm => '<option value="' + escapeHtml(farm.id) + '">' + escapeHtml(farm.name) + '</option>').join('');
          }

          const farmList = document.getElementById('farmList');
          farmList.innerHTML = farms.length ? '<table><thead><tr><th>اسم المزرعة</th><th>المنطقة</th><th>المساحة</th><th>المالك</th></tr></thead><tbody>' + farms.map(f => '<tr><td>' + escapeHtml(f.name) + '</td><td>' + escapeHtml(f.region) + '</td><td>' + escapeHtml(String(f.area_ha)) + '</td><td>' + escapeHtml(f.owner || '-') + '</td></tr>').join('') + '</tbody></table>' : '<p class="muted">لا توجد مزارع محفوظة بعد.</p>';

          const activity = document.getElementById('activityList');
          const recent = data.recent_activity || [];
          activity.innerHTML = recent.length ? '<table><thead><tr><th>النوع</th><th>الاسم</th><th>التاريخ</th></tr></thead><tbody>' + recent.map(item => '<tr><td>' + escapeHtml(item.type) + '</td><td>' + escapeHtml(item.name) + '</td><td>' + escapeHtml(item.created_at || '') + '</td></tr>').join('') + '</tbody></table>' : '<p class="muted">لا يوجد نشاط حديث.</p>';

          loginSection.classList.add('hidden');
          dashboard.classList.remove('hidden');
        } catch (error) {
          loginSection.classList.remove('hidden');
          dashboard.classList.add('hidden');
        }
      }

      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const err = document.getElementById('loginError');
        err.textContent = '';
        try {
          const response = await fetchJson('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          if (response.status === 'authenticated') {
            await loadDashboard();
          }
        } catch (error) {
          err.textContent = error.message;
        }
      });

      document.getElementById('logout').addEventListener('click', async () => {
        await fetch('/logout', { method: 'POST' });
        dashboard.classList.add('hidden');
        loginSection.classList.remove('hidden');
      });

      document.getElementById('farmForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = {
          name: document.getElementById('farmName').value,
          region: document.getElementById('farmRegion').value,
          owner: document.getElementById('farmOwner').value,
          area_ha: Number(document.getElementById('farmArea').value),
          notes: document.getElementById('farmNotes').value
        };
        await fetchJson('/api/farms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        document.getElementById('farmForm').reset();
        await loadDashboard();
      });

      document.getElementById('fieldForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const farmId = farmSelect.value;
        if (!farmId) return;
        const payload = {
          name: document.getElementById('fieldName').value,
          crop: document.getElementById('fieldCrop').value,
          soil_type: document.getElementById('fieldSoil').value,
          irrigation: document.getElementById('fieldIrrigation').value,
          area_ha: Number(document.getElementById('fieldArea').value)
        };
        await fetchJson('/api/farms/' + farmId + '/fields', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        document.getElementById('fieldForm').reset();
        await loadDashboard();
      });

      loadDashboard().catch(() => {});
    </script>
  </body>
</html>
