name: Build JaziraAgri Mobile

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jaziraagri-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==1.1.3"

      - name: Verify Flet version
        run: flet --version

      - name: Build APK
        run: flet build apk --verbose --python-version 3.12

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jaziraagri-apk-${{ github.run_number }}
          path: build/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build AAB
        run: flet build aab --verbose --python-version 3.12

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: jaziraagri-aab-${{ github.run_number }}
          path: build/aab/**/*.aab
          if-no-files-found: error
          retention-days: 14
