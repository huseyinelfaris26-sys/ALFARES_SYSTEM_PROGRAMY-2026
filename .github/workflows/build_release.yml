name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: pip install "flet[all]==1.1.3"

      - name: Build APK
        run: flet build apk -v

      - uses: actions/upload-artifact@v4
        with:
          name: jazira-agri-apk
          path: build/apk/*.apk
