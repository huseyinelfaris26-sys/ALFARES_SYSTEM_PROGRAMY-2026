name: Release JaziraAgri APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jaziraagri-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==1.1.3"

      - name: Verify Flet version
        run: flet --version

      - name: Build APK
        run: flet build apk --verbose --python-version 3.12

      - name: Rename APK
        run: |
          mkdir -p release
          APK_FILE=$(find build/apk -type f -name "*.apk" | head -n 1)
          cp "$APK_FILE" "release/JaziraAgri-OS-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: JaziraAgri OS ${{ github.ref_name }}
          body: |
            ## JaziraAgri OS ${{ github.ref_name }}

            تحميل تطبيق JaziraAgri OS لنظام Android.

            ### التثبيت
            1. نزّل ملف APK.
            2. افتح الملف على الهاتف.
            3. اسمح بتثبيت التطبيقات من مصادر غير معروفة إذا طلب الهاتف ذلك.
            4. أكمل التثبيت وافتح التطبيق.
          files: |
            release/*.apk
          draft: false
          prerelease: false
