name: Build JaziraAgri-OS Apps

on:
  workflow_dispatch: # يسمح لك بتشغيل البناء يدوياً متى شئت بضغطة زر

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flet
        run: pip install flet

      - name: Build Android APK
        run: flet build apk --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JaziraAgri-Android-APK
          path: build/apk/*.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flet
        run: pip install flet

      - name: Build Windows App
        run: flet build windows --verbose

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JaziraAgri-Windows-App
          path: build/windows/*
