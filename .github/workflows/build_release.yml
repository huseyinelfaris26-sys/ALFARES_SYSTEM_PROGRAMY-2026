name: Build JaziraAgri-OS APK & Desktop

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17 (Required for Android APK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet>=0.25.0" pillow numpy pydantic requests

      - name: Build Android APK
        run: echo "y" | flet build apk --yes --verbose

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: JaziraAgri-OS-Android-APK
          path: build/apk/*.apk

  build-windows-desktop:
    runs-on: windows-latest
    env:
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet>=0.25.0" pillow numpy pydantic requests

      - name: Build Windows Executable
        shell: bash
        run: echo "y" | flet build windows --yes --verbose

      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: JaziraAgri-OS-Windows
          path: build/windows/**
